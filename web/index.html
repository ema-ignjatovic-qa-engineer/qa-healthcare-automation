<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QA Healthcare Patient Portal</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Healthcare Patient Portal</h1>
        <p>Patient Management System</p>
    </header>

    <main>

        <section class="patients-section">

            <div class="section-header">
                <h2>Patients</h2>

                <button id="addPatientButton">
                    Add Patient
                </button>
            </div>

            <div id="loading">
                Loading patients...
            </div>

            <div id="patientsContainer"></div>

        </section>

        <section id="patientFormSection" class="form-section hidden">

            <h2>Add New Patient</h2>

            <form id="patientForm">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input
                        type="date"
                        id="dateOfBirth"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input
                        type="text"
                        id="phone"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit">
                        Save Patient
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>
                </div>

            </form>

        </section>
        <section class="payment-section">
            <div class="section-header">
                <h2>POS Payment Simulator</h2>
            </div>

            <div class="order-summary">
                <h3>Order ORD-1001</h3>

                <p>Subtotal: $45.00</p>
                <p>Tax: $5.00</p>
                <p>Tip: $0.00</p>
                <p class="total">Total: $50.00</p>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>

                <select id="paymentMethod">
                    <option value="">Select payment method</option>
                    <option value="card">Credit / Debit Card</option>
                    <option value="contactless">Contactless</option>
                    <option value="cash">Cash</option>
                    <option value="gift-card">Gift Card</option>
                    <option value="digital-wallet">Digital Wallet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentAmount">Payment Amount</label>

                <input
                    type="number"
                    id="paymentAmount"
                    value="50.00"
                    min="0"
                    step="0.01"
                >
            </div>
            <div class="form-group">
                <label for="paymentResult">Simulated Processor Result</label>

                <select id="paymentResult">
                    <option value="approved">Approved</option>
                    <option value="declined">Declined</option>
                    <option value="insufficient-funds">Insufficient Funds</option>
                    <option value="expired-card">Expired Card</option>
                    <option value="timeout">Timeout</option>
                    <option value="processor-error">Processor Error</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="button" id="payButton">
                    Pay $50.00
                </button>
            </div>

            <div id="paymentStatus" class="payment-status">
                Ready for payment
            </div>
        </section>
        <div id="message"></div>

    </main>

    <script src="app.js"></script>

</body>
</html>

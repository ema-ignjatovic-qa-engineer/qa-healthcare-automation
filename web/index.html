<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QA Healthcare Patient Portal</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Healthcare Patient Portal</h1>
        <p>Patient Management System</p>
    </header>

    <main>

        <section class="patients-section">

            <div class="section-header">
                <h2>Patients</h2>

                <button id="addPatientButton">
                    Add Patient
                </button>
            </div>

            <div id="loading">
                Loading patients...
            </div>

            <div id="patientsContainer"></div>

        </section>

        <section id="patientFormSection" class="form-section hidden">

            <h2>Add New Patient</h2>

            <form id="patientForm">

                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input
                        type="text"
                        id="firstName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input
                        type="text"
                        id="lastName"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input
                        type="date"
                        id="dateOfBirth"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input
                        type="text"
                        id="phone"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit">
                        Save Patient
                    </button>

                    <button
                        type="button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>
                </div>

            </form>

        </section>

        <div id="message"></div>

    </main>

    <script src="app.js"></script>

</body>
</html>
